name: Build Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ШАГ 1: Создаем переменную в нижнем регистре
      - name: Lowercase Repository Name
        id: string
        run: |
          # Берем имя 'ghcr.io/Maggich/Docker-registry' и переводим в 'ghcr.io/maggich/docker-registry'
          IMAGE_TAG="ghcr.io/${{ github.repository }}"
          echo "IMAGE_NAME=$(echo "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # ШАГ 2: Используем готовую переменную окружения (IMAGE_NAME)
      - name: Build and Push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Берем полученную из предыдущего шага lowercase строку и добавляем к ней :latest
          tags: ${{ env.IMAGE_NAME }}:latest
